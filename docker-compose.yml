# Local MongoDB for development:  docker compose up -d mongo
services:
  mongo:
    # If this container exits with "Linux kernel versions 6.19 and newer has a known
    # incompatibility", change the image to mongo:7 (see MongoDB issue SERVER-121912).
    image: mongo:8
    container_name: notenest-mongo
    ports:
      - "27017:27017"
    volumes:
      - notenest-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notenest-data:
