# Runs the API tests against a real MongoDB and builds the client on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        # mongo:8 refuses to start on the runners' Linux kernel 6.19+ (MongoDB issue
        # SERVER-121912), so CI uses MongoDB 7. The app code works the same on both.
        image: mongo:7
        ports:
          - 27017:27017
        # GitHub waits until this passes, so tests never start before MongoDB is ready.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/notenest_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
